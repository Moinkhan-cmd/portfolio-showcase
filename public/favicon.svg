<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100">
  <defs>
    <clipPath id="circleClip">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
    <mask id="circleMask">
      <rect width="100" height="100" fill="white"/>
      <circle cx="50" cy="50" r="50" fill="black"/>
    </mask>
  </defs>
  <!-- Circular container with your logo -->
  <circle cx="50" cy="50" r="50" fill="#06b6d4"/>
  <image href="/favicon.png" x="0" y="0" width="100" height="100" clip-path="url(#circleClip)" preserveAspectRatio="xMidYMid cover"/>
  <!-- Optional: Circular border -->
  <circle cx="50" cy="50" r="50" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
</svg>
